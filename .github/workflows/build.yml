name: Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - name: Compile all .cpp files
        run: |
          for file in *.cpp; do
            echo "Compiling $file"
            g++ -std=c++17 -Wall -I /usr/include/eigen3 -c "$file" -o "${file%.cpp}.o"
          done

  build-cmake-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build cmake_demo
        run: |
          cmake -S cmake_demo -B cmake_demo/build
          cmake --build cmake_demo/build

name: Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile all .cpp files
        run: |
          for file in *.cpp; do
            echo "Compiling $file"
            g++ -std=c++17 -Wall -c "$file" -o "${file%.cpp}.o"
          done